# Local fixed-camera vehicle settings for the installed Ultralytics TrackTrack.
# Low-confidence detections can retain an existing ID but cannot start one.
tracker_type: tracktrack
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 30
match_thresh: 0.70
lost_match_thr: 0.0
iou_weight: 0.5
reid_weight: 0.5
conf_weight: 0.1
angle_weight: 0.05
penalty_p: 0.2
penalty_q: 0.4
reduce_step: 0.05
tai_thr: 0.55
min_track_len: 3
gmc_method: none
with_reid: false
model: auto
